[project]
name = "webclaw-dify"
version = "0.1.0"
description = "Webclaw tool provider for Dify"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "dify_plugin==0.10.2",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
