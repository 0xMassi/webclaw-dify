identity:
  author: 0xmassi
  name: map
  label:
    en_US: Map
description:
  human:
    en_US: Discover URLs published by a website.
  llm: Map a website into a list of discoverable URLs, with a search term when the user wants a focused result.
parameters:
  - name: url
    type: string
    required: true
    form: llm
    label:
      en_US: Website URL
    human_description:
      en_US: The website to map.
    llm_description: The complete HTTP or HTTPS base URL of the website to map.
  - name: search
    type: string
    required: false
    form: llm
    label:
      en_US: Filter
    human_description:
      en_US: Optional term used to focus URL discovery.
    llm_description: An optional short term describing which website URLs are relevant.
  - name: limit
    type: number
    required: false
    form: form
    label:
      en_US: Page size
    human_description:
      en_US: Maximum URLs returned in this page.
    min: 1
    max: 5000
    default: 100
  - name: cursor
    type: string
    required: false
    form: form
    label:
      en_US: Cursor
    human_description:
      en_US: Opaque next_cursor from a previous Map result.
extra:
  python:
    source: tools/map.py
